# Detection stage config: vehicle detector (COCO-pretrained baseline) and
# plate detector (requires custom training — see docs/roadmap.md stage 2).

vehicle_detector:
  weights_path: "yolo11n.pt"   # auto-downloaded by ultralytics on first use
  confidence_threshold: 0.4
  classes: ["car", "motorcycle", "bus", "truck"]  # subset of COCO used

plate_detector:
  weights_path: "models/plate_detector/best.pt"  # not present until trained
  confidence_threshold: 0.5
  architecture: "yolo26n"  # confirmed available; see docs/decisions.md #7 (resolved)
  input_size: 640

training:
  epochs: 100
  batch_size: 64  # GPU had ~5GB headroom at batch=16 (yolo26n is small); see docs/decisions.md #16
  image_size: 640
  patience: 20  # early stopping
  device: "0"   # first CUDA GPU; "cpu" to force CPU
  workers: 8    # DataLoader worker processes (see docs/decisions.md #14 — don't repeat the classifier's mistake)
  cache: "disk"  # NOT "ram": on Windows, spawn-based DataLoader workers each re-pickle the
                 # full RAM cache into their own process, multiplying memory by `workers` —
                 # crashed with MemoryError at workers=8. "disk" avoids repeated decode of large
                 # source images without that blowup; see docs/decisions.md #17.
