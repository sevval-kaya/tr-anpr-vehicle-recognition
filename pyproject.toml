[project]
name = "plaka"
version = "0.1.0"
description = "Turkish license plate recognition (ANPR/LPR) + broad-coverage vehicle make/model recognition"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Core CV/ML stack. Pinned loosely on purpose; lock via `pip freeze` once
# the target CUDA/torch combination for the training machine is confirmed.
detection = [
    "ultralytics>=8.3",
]
ocr = [
    "paddleocr>=2.8",
    "paddlepaddle>=2.6",
]
classification = [
    "torch>=2.3",
    "torchvision>=0.18",
    "timm>=1.0",
]
tracking = [
    "wandb>=0.17",
    "mlflow>=2.14",
]
serving = [
    "onnxruntime>=1.18",
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
